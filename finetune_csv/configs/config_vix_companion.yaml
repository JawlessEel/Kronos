  exp_name: VIX_companion_multi_tf
  base_path: /Volumes/MacMoneyMakerSSD/Ai_apps/kronos/finetune_csv/finetuned
  base_save_path: ''
  finetuned_tokenizer: ''
  tokenizer_save_name: tokenizer
  basemodel_save_name: basemodel
experiment:
  name: vix_companion_multi_tf
  description: VIX Companion Multi-Timeframe (VIXY, UVXY, I:VIX through 2026-10-09)
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: true
