name: KronosApple
options:
  bundleIdPrefix: com.jawless
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    KRONOS_APP_GROUP: group.com.jawless.kronos
    CODE_SIGN_STYLE: Automatic
targets:
  KronosPhone:
    type: application
    platform: iOS
    sources: [Shared, Phone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jawless.kronos
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Generated/Phone-Info.plist
      properties:
        CFBundleDisplayName: Kronos
        UILaunchScreen: {}
        KronosAppGroup: $(KRONOS_APP_GROUP)
    entitlements:
      path: Generated/Phone.entitlements
      properties:
        com.apple.security.application-groups: [$(KRONOS_APP_GROUP)]
    dependencies:
      - target: KronosWatch
        embed: true
  KronosWatch:
    type: application
    platform: watchOS
    sources: [Shared, Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jawless.kronos.watch
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Kronos
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jawless.kronos
        WKWatchOnly: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [kronos]
        KronosAppGroup: $(KRONOS_APP_GROUP)
    entitlements:
      path: Generated/Watch.entitlements
      properties:
        com.apple.security.application-groups: [$(KRONOS_APP_GROUP)]
    dependencies:
      - target: KronosComplication
        embed: true
  KronosComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
        excludes: [WatchBridge.swift]
      - path: Complication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jawless.kronos.watch.complication
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Complication-Info.plist
      properties:
        CFBundleDisplayName: Kronos Today
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        KronosAppGroup: $(KRONOS_APP_GROUP)
    entitlements:
      path: Generated/Complication.entitlements
      properties:
        com.apple.security.application-groups: [$(KRONOS_APP_GROUP)]
schemes:
  KronosPhone:
    build:
      targets:
        KronosPhone: all
  KronosWatch:
    build:
      targets:
        KronosWatch: all
