<!-- Pulse rune loader: rise-and-settle entry, then slow breathing glow. Tune with --pulse-glow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <linearGradient id="pulseGradAnim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <style>
    .m { transform-origin: 48px 48px; animation: rise .62s cubic-bezier(.34,1.56,.64,1) both, glow 3.4s ease-in-out .62s infinite; }
    @keyframes rise { from { transform: translateY(-6px) scale(.72); } to { transform: translateY(0) scale(1); } }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 3px var(--pulse-glow, rgba(124,92,255,.45))); } 50% { filter: drop-shadow(0 0 11px var(--pulse-glow, rgba(124,92,255,.45))); } }
  </style>
  <path class="m" fill="url(#pulseGradAnim)" fill-rule="evenodd" d="M48 3 L83.48 38.16 L58.81 63.32 L67.52 71.87 L78.32 61.39 L88.32 71.87 L67.52 93 L48 73.97 L28.48 93 L7.68 71.87 L17.68 61.39 L28.48 71.87 L37.19 63.32 L12.52 38.16 Z M48 23.97 L62.36 38.32 L48 52.68 L33.64 38.32 Z"/>
</svg>
