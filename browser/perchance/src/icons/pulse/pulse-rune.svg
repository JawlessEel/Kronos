<!-- Pulse rune — CRYPTO PULSE mark. Othala geometry (same as Utterly/DadChat), recoloured violet→cyan to match the terminal. Theme-aware via prefers-color-scheme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <style>
    .pulse-rune-a { stop-color: #A78BFA; }
    .pulse-rune-b { stop-color: #22D3EE; }
    @media (prefers-color-scheme: light) {
      .pulse-rune-a { stop-color: #6D28D9; }
      .pulse-rune-b { stop-color: #0E7490; }
    }
  </style>
