name: Checks

# Offline project checks (pytest + Node contract tests) on CPU-only torch.
# Postgres-backed tests skip themselves; no secrets are used or required.
on:
  push:
    branches: [master, Claudes_upgrades]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            webui/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Hugging Face weights used by the regression test
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-kronos-small-901c26c

      - name: Install CPU torch and project requirements
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r webui/requirements.txt pytest

      - name: Run checks
        run: python scripts/run_checks.py
